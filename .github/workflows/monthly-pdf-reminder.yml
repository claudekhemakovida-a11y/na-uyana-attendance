# Monthly reminder: on the day before the last day of each month (Sri Lanka time),
# opens a GitHub issue that mentions the owner, so GitHub sends an email (and a push
# notification in the GitHub mobile app). Runs on GitHub's free servers; it does not need Claude.
name: Monthly PDF reminder

on:
  schedule:
    - cron: "11 11 27-31 * *"   # 11:11 UTC = 16:41 in Sri Lanka, days 27-31
  workflow_dispatch: {}         # "Run workflow" button, sends a test reminder now

permissions:
  issues: write
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const now = new Date(Date.now() + 5.5 * 3600 * 1000);          // Sri Lanka time
            const y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
            const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
            const manual = context.eventName === "workflow_dispatch";
            if (!manual && d !== last - 1) { core.info(`Day ${d}: not the reminder day.`); return; }
            if (!manual && y < 2027) { core.info("Reminders start in 2027."); return; }

            const SI = ["ජනවාරි","පෙබරවාරි","මාර්තු","අප්‍රේල්","මැයි","ජූනි","ජූලි","අගෝස්තු","සැප්තැම්බර්","ඔක්තෝබර්","නොවැම්බර්","දෙසැම්බර්"];
            const EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            const owner = context.repo.owner, repo = context.repo.repo;
            const url = `https://${owner}.github.io/${repo}/#pdf`;
            const title = `${manual ? "[පරීක්ෂණය] " : ""}${y} ${SI[m]} — මාසික පැමිණීම් PDF වාර්තාව`;
            const body = [
              `@${owner}`,
              ``,
              `**${y} ${SI[m]} මාසයේ සේවක පැමිණීම් PDF වාර්තාව බාගැනීමට කාලයයි.**`,
              ``,
              `පරිපාලක ගිණුමෙන් ඇප් එක විවෘත කරන්න: ${url}`,
              `අද සිට පරිපාලකයෙකු ඇප් එක විවෘත කළ විට PDF එක ස්වයංක්‍රීයව බාගත වේ. එසේ නොවුණොත් ඉහළින් ඇති "PDF බාගන්න" තීරුව ඔබන්න.`,
              ``,
              `---`,
              `Time to download the ${EN[m]} ${y} staff attendance PDF. Open ${url} as an administrator; the PDF downloads automatically, or press the "Download PDF" bar.`,
              ``,
              `_PDF එක බාගත් පසු මෙම issue එක "Close issue" මගින් වසන්න._`
            ].join("\n");

            // close older reminders that are still open
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", creator: "github-actions[bot]" });
            for (const i of open) if (/මාසික පැමිණීම් PDF වාර්තාව/.test(i.title)) await github.rest.issues.update({ owner, repo, issue_number: i.number, state: "closed" });

            const issue = await github.rest.issues.create({ owner, repo, title, body });
            core.info(`Opened #${issue.data.number}`);

            // record the run in the repository so GitHub keeps this scheduled workflow active
            const path = ".github/last-reminder.txt";
            let sha; try { sha = (await github.rest.repos.getContent({ owner, repo, path })).data.sha; } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, sha,
              message: `Reminder sent: ${y}-${String(m + 1).padStart(2, "0")}`,
              content: Buffer.from(`${now.toISOString()}\n`).toString("base64") });
