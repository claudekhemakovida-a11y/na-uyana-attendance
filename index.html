<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#575231">
<meta name="description" content="Nā Uyana Dharmāyatanaya — staff attendance register">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="පැමිණීම">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>නා උයන — සේවක පැමිණීම</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@600;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* Layout: a top bar with the Nā Uyana logo and viewer preferences (language, theme); staff see one marking card, administrators get tabs.
   Palette: drawn from the logo — olive lettering as the accent, temple-flower gold as the second accent, on light grey or soft charcoal. */
:root{
  --logo-l:url("logo-light.webp"); --logo-d:url("logo-dark.webp"); --logo:var(--logo-l);
  --paper:#ECEEF0; --sheet:#F8F9FA; --ink:#25272C; --ink-2:#5B6069; --rule:#D3D7DC; --rule-2:#E3E6E9;
  --accent:#575231; --accent-bg:#E6E4D6; --gold:#94681F; --gold-bg:#F3E9D4;
  --ok:#1F7550; --ok-bg:#DDEFE5; --late:#9C5B00; --late-bg:#F7EAD2; --miss:#AD3746; --miss-bg:#F6E0E3;
  --on-solid:#FFFFFF; --solid:#25272C; --on-ink:#F8F9FA; --lv:#2F5E8C; --lv-bg:#DEE8F3;
  --f-display:"Abhaya Libre","Noto Serif Sinhala",Georgia,serif;
  --f-body:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-app-theme="light"]){
  --logo:var(--logo-d);
  --paper:#2A2C30; --sheet:#33363B; --ink:#ECEAE3; --ink-2:#A9ACB3; --rule:#474B52; --rule-2:#3C4046;
  --accent:#D8CF9F; --accent-bg:#45432F; --gold:#E2B86E; --gold-bg:#4A3D24;
  --ok:#6CCDA3; --ok-bg:#24402F; --late:#EDB55A; --late-bg:#4A3818; --miss:#F09AA5; --miss-bg:#4C2A30;
  --on-solid:#1F2023; --solid:#ECEAE3; --on-ink:#2A2C30; --lv:#9CC3EC; --lv-bg:#24384D; color-scheme:dark}}
:root[data-theme="dark"]:not([data-app-theme="light"]),:root[data-app-theme="dark"]{
  --logo:var(--logo-d);
  --paper:#2A2C30; --sheet:#33363B; --ink:#ECEAE3; --ink-2:#A9ACB3; --rule:#474B52; --rule-2:#3C4046;
  --accent:#D8CF9F; --accent-bg:#45432F; --gold:#E2B86E; --gold-bg:#4A3D24;
  --ok:#6CCDA3; --ok-bg:#24402F; --late:#EDB55A; --late-bg:#4A3818; --miss:#F09AA5; --miss-bg:#4C2A30;
  --on-solid:#1F2023; --solid:#ECEAE3; --on-ink:#2A2C30; --lv:#9CC3EC; --lv-bg:#24384D; color-scheme:dark}
:root[data-app-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;transition:background .2s,color .2s}
.wrap{max-width:1120px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.logo{height:clamp(52px,9vw,76px);aspect-ratio:995/322;max-width:100%;background:var(--logo) left center/contain no-repeat;flex:0 1 auto}
.prefs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-left:auto}
.pref{display:flex;align-items:center;gap:6px}
.pref>span{font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--sheet)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-ink);font-weight:600}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid var(--ink-2);display:inline-block}
.sw.l{background:#ECEEF0}.sw.d{background:#2A2C30}.sw.a{background:linear-gradient(90deg,#ECEEF0 50%,#2A2C30 50%)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0;text-wrap:balance;color:var(--accent)}
h2{font-family:var(--f-display);font-size:23px;margin:0;font-weight:800;text-wrap:balance}
h3{margin:0;font-size:15px}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:14px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--solid);color:var(--on-ink);border-color:var(--solid)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;min-width:0}
.btn{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--solid);color:var(--on-ink);border-color:var(--solid);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink-2)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.late{background:var(--late-bg);color:var(--late)}
.chip.miss{background:var(--miss-bg);color:var(--miss)}
.chip.info{background:var(--accent-bg);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=date],input[type=month],input[type=time],input[type=text],input[type=tel],input[type=email],select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* staff mark card */
.mark{max-width:520px;margin:0 auto;width:100%;display:grid;gap:16px}
.clock{font-family:var(--f-mono);font-size:clamp(44px,13vw,64px);font-weight:600;letter-spacing:-.02em;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.dateline{text-align:center;color:var(--ink-2);margin-top:6px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--rule-2);padding-top:14px}
.who b{font-size:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;border-radius:12px;padding:18px 12px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;display:grid;gap:2px;text-align:center;color:var(--on-solid)}
.act small{font-weight:400;font-size:12.5px;opacity:.9}
.act.in{background:var(--ok);grid-column:1/-1}
.act.out{background:var(--solid);color:var(--on-ink)}
.act.early{background:var(--late)}
.act.offi,.act.back{background:var(--gold);grid-column:1/-1}
.sheet{border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--paper)}
.names{display:grid;gap:8px}
.names button{text-align:left;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;cursor:pointer}
.notice{padding:14px;border-radius:10px;background:var(--accent-bg);color:var(--ink);font-size:14px}
.notice.warn{background:var(--late-bg)}
.done{padding:18px;border-radius:12px;background:var(--ok-bg);color:var(--ok);text-align:center;font-weight:600;font-size:17px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer}
.reasons button[aria-pressed="true"]{background:var(--late);color:var(--on-solid);border-color:var(--late)}
.brand{text-align:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink-2)}
body.staffmode header.top{display:none}
body.staffmode .wrap{max-width:560px}
body.staffmode .panel{border:0;background:transparent;padding:4px 0}
body.staffmode .topbar{justify-content:center}
body.staffmode .logo{height:58px}
body.staffmode .prefs{margin-left:0;justify-content:center;width:100%}

/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--ink-2)}
.board{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) 80px 80px minmax(0,1.6fr);gap:12px;align-items:center;border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px}
.brow .lbl{font-size:11px;color:var(--ink-2);display:block}
@media (max-width:620px){.brow{grid-template-columns:1fr 1fr}.brow .nm,.brow .nt{grid-column:1/-1}}
.tablebox{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{border-bottom:1px solid var(--rule-2);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--rule-2);font-weight:600;font-size:13px}
td.d{font-family:var(--f-mono);font-weight:500;border-right:1px solid var(--rule-2);width:58px;text-align:center}
tr.daystart td{border-top:2px solid var(--rule)}
tr.we td{background:color-mix(in srgb,var(--rule-2) 45%,transparent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.list{display:grid;gap:8px}
.item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px}
.item .grow{flex:1 1 180px;min-width:0}
.srow2{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;width:100%;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer}
.srow2:hover{border-color:var(--ink-2)}
.srow2[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.srow2 .grow{flex:1;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12.5px;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{width:100%}
.sub2{display:grid;gap:8px;border-top:1px solid var(--rule-2);padding-top:12px}
.photoRow{display:flex;gap:14px;align-items:center}
.chip.lv{background:var(--lv-bg);color:var(--lv)}
.leavebox{display:grid;gap:10px;border-top:1px solid var(--rule-2);padding-top:14px}
.lbals{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.lbal{border:1px solid var(--rule-2);border-radius:10px;padding:8px 10px;display:grid;gap:2px;font-size:13px}
.lbal b{font-size:14px}
.reasons button:disabled{opacity:.4;cursor:not-allowed}
.photo{width:90px;height:120px;flex:0 0 auto;border-radius:8px;border:1px solid var(--rule);background:var(--paper);overflow:hidden;display:grid;place-items:center;color:var(--ink-2)}
.photo img{width:100%;height:100%;object-fit:cover}
.av{width:36px;height:48px;flex:0 0 auto;border-radius:6px;object-fit:cover;background:var(--rule-2);color:var(--ink-2);display:grid;place-items:center;overflow:hidden}
.declare{display:grid;gap:4px;padding:12px;border-radius:10px;background:var(--gold-bg);border:1px solid var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
.qrbox{display:grid;justify-items:center;gap:12px;text-align:center}
#qr{background:#fff;padding:18px;border-radius:12px;border:1px solid var(--rule)}
#qr img{display:block;width:260px;height:260px;max-width:100%}
#qr canvas{display:none!important}
.url{font-family:var(--f-mono);font-size:12px;word-break:break-all;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--solid);color:var(--on-ink);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.loading{padding:40px;text-align:center;color:var(--ink-2)}
.duebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:var(--gold-bg);border:1px solid var(--gold);margin-bottom:18px}
.duebar b{font-size:16px}
.guide{border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--accent)}
.guide .gbody{padding:0 14px 14px;display:grid;gap:12px}
.glist{margin:0;display:grid;gap:8px}
.helplist{display:grid;gap:8px}
.glist div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:start}
.glist dd{margin:0;font-size:14px}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 10px;font-size:13px}
@media (max-width:560px){.glist div{grid-template-columns:minmax(0,1fr);gap:2px}}

/* off-screen A4 pages used only to build the PDF (fixed print colours, independent of theme) */
.pdfhost{position:fixed;left:-12000px;top:0;width:794px;z-index:-1}
.pg{width:794px;height:1123px;padding:40px 48px 40px;background:#fff;color:#25272C;font-family:"Noto Sans Sinhala","Iskoola Pota",sans-serif;font-size:12.5px;line-height:1.45;letter-spacing:0;display:flex;flex-direction:column;overflow:hidden}
.pg .ph{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid #575231;padding-bottom:10px;margin-bottom:12px}
.pg .ph img{height:46px;width:auto}
.pg .ph .tt{text-align:right}
.pg .ph h1{font-family:"Noto Sans Sinhala",sans-serif;font-size:17px;font-weight:700;margin:0;letter-spacing:0;color:#25272C}
.pg .ph span{font-size:10.5px;color:#5B6069}
.pg .body{flex:1;min-height:0}
.pg table{min-width:0;width:100%;border-collapse:collapse;font-size:12px}
.pg th{background:#E6E4D6;color:#25272C;font-size:11.5px;padding:5px 7px;border:1px solid #CFCBB5}
.pg td{padding:4px 7px;border:1px solid #D3D7DC;vertical-align:top}
.pg td.c{text-align:center;font-family:"IBM Plex Mono",monospace}
.pg tr.we td{background:#F3F4F5}
.pg .lt{color:#9C5B00;font-weight:600}
.pg h2{font-family:"Noto Sans Sinhala",sans-serif;font-size:14px;margin:4px 0 6px;letter-spacing:0;color:#575231}
.pg .pf{display:flex;justify-content:space-between;font-size:10.5px;color:#5B6069;border-top:1px solid #D3D7DC;padding-top:6px;margin-top:8px}
.pg .sign{display:flex;justify-content:space-between;gap:40px;margin-top:28px;font-size:12px}
.pg .sign div{flex:1;border-top:1px dotted #25272C;padding-top:4px;text-align:center}
@media (prefers-reduced-motion:reduce){body{transition:none}}
.signin{max-width:440px;margin:0 auto;display:grid;gap:16px;text-align:center}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:12px 18px;border-radius:10px;cursor:pointer}
.gbtn svg{width:20px;height:20px}
.who-am{font-size:12px;color:var(--ink-2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="logo" role="img" aria-label="Nā Uyana Dharmāyatanaya — Theravada Dhamma Academic Center"></div>
    <div class="prefs" id="prefs"></div>
  </div>
  <header class="top">
    <div>
      <h1 id="h1">සේවක පැමිණීමේ ලේඛනය</h1>
      <p class="sub" id="subline"></p>
    </div>
    <span id="role" class="pill">…</span>
  </header>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  <main id="view"><div class="panel loading">…</div></main>
</div>
<div id="toastRoot"></div>

<script>
(function(){
const APP_URL=location.origin+location.pathname.replace(/index\.html$/,"")+"#mark";
const LOGO_PRINT="logo-light.webp";

/* ================= LANGUAGE ================= */
const L={
si:{

  pdfReports:"මාසික PDF වාර්තා", pdfHelp:"සෑම මසකම අවසාන දිනට පෙර දින සිට, පරිපාලකයෙකු ඇප් එක විවෘත කළ විට එම මාසයේ PDF එක ස්වයංක්‍රීයව බාගත වේ. බාගත නොවුණොත් ඉහළින් පෙන්වන \"PDF බාගන්න\" තීරුව ඔබන්න.",
  savedOn:d=>`${d} සුරැකුණි`, reDl:"නැවත බාගන්න", noPdf:"තවම PDF වාර්තා සුරැකී නැත.",
  helpHead:"ඇප් එක භාවිත කරන ආකාරය — මාර්ගෝපදේශය", helpIntro:"එක් එක් කොටස ඔබා විවෘත කරන්න.", help:[["1. ආරම්භක සැකසුම (පරිපාලක)", ["\"සැකසුම්\" ටැබයේ ප්‍රමාද වේලාව හා සාමාන්‍ය පිටවීමේ වේලාව ඇතුළත් කර \"සැකසුම් සුරකින්න\" ඔබන්න.", "\"සේවකයින්\" ටැබයේ \"+ නව සේවකයෙකු\" ඔබා සෑම සේවකයෙකුගේම නම, තනතුර හා අනෙක් විස්තර ඇතුළත් කරන්න.", "\"සැකසුම්\" ටැබයේ \"පරිපාලකයින්\" කොටසට දෙවන පරිපාලකයාගේ Google email ලිපිනය එක් කරන්න.", "\"QR කේතය\" ටැබයෙන් QR රූපය බාගෙන, මුද්‍රණය කර කාර්යාල ප්‍රවේශ දොරටුව අසල අලවන්න."]], ["2. සේවකයින් ලියාපදිංචි කිරීම", ["සේවකයා QR කේතය ස්කෑන් කර \"Google ගිණුමෙන් පිවිසෙන්න\" ඔබයි. අවශ්‍ය නම් \"ඇප් එක ස්ථාපනය කරන්න\" (හෝ iPhone හි Share → Add to Home Screen) මගින් ඇප් එක දුරකථනයට දැමිය හැක.", "\"ඔබ කවුද?\" ලැයිස්තුවෙන් තම නම තෝරයි. මෙය කළ යුත්තේ පළමු වරට පමණි.", "පරිපාලක \"සේවකයින්\" ටැබයේ ඉහළින් පෙන්වන ඉල්ලීම පරීක්ෂා කර \"අනුමත කරන්න\" ඔබයි. වැරදි නමක් තෝරා ඇත්නම් \"ප්‍රතික්ෂේප කරන්න\".", "අනුමත කළ පසු, එම ගිණුමෙන් ස්කෑන් කරන සෑම විටම සේවකයා ස්වයංක්‍රීයව හඳුනා ගනී."]], ["3. සේවකයාගේ දෛනික භාවිතය", ["පැමිණි විට: QR ස්කෑන් කර \"පැමිණීම\" ඔබා \"තහවුරු කරන්න\".", "නිල කටයුත්තකට පිටතට යන විට: \"නිල කටයුත්තකට පිටතට\" ඔබා, ලැයිස්තුවෙන් කටයුත්ත තෝරා තහවුරු කරන්න. ආපසු පැමිණි විට නැවත ස්කෑන් කර \"ආපසු පැමිණීම\" ඔබන්න.", "සාමාන්‍ය පිටවීමේ වේලාවට පෙර යන විට: \"කලින් පිටවීම\" ඔබා, ලැයිස්තුවෙන් හේතුව තෝරා තහවුරු කරන්න.", "දවසේ වැඩ අවසානයේ: \"පිටවීම\" ඔබා තහවුරු කරන්න. ඉන්පසු \"අද දිනයේ පැමිණීම සම්පූර්ණයි\" යන්න පෙන්වයි.", "වේලාව ලබා ගන්නේ දුරකථනයේ ඔරලෝසුවෙනි. දුරකථනයේ වේලාව නිවැරදි දැයි සහතික කර ගන්න."]], ["4. පරිපාලකයාගේ දෛනික පරීක්ෂාව", ["\"අද දිනය\" ටැබයේ පැමිණි, ප්‍රමාද, කලින් පිටවූ හා නිල කටයුත්තක සිටින අය එකවර පෙන්වයි.", "දින තේරීමෙන් පසුගිය ඕනෑම දිනයක් බැලිය හැක.", "කොළ = නියමිත වේලාවට, තැඹිලි = ප්‍රමාද / කලින් පිටවීම, රතු = නොපැමිණි, ඔලිව් = ගිණුම සම්බන්ධ නැත හෝ නිල කටයුත්තක."]], ["5. මාසික ලේඛනය හා PDF වාර්තාව", ["\"මාසික ලේඛනය\" ටැබයේ මාසය තෝරා සියලු දින හා සටහන් බලන්න. වත්මන් මාසය අද දිනය දක්වා පමණක් පෙන්වයි.", "සෑම මසකම අවසාන දිනට පෙර දින සිට ඇප් එකේ const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const T=()=>L[lang];
const t=(k,...a)=>{const v=L[lang][k];return typeof v==="function"?v(...a):v};

function applyTheme(){
  const r=document.documentElement;
  if(themePick==="auto") r.removeAttribute("data-app-theme"); else r.setAttribute("data-app-theme",themePick);
}
applyTheme();

  const l=e.target.closest("[data-lang]"); const p=e.target.closest("[data-tpick]");
  if(l){lang=l.dataset.lang;store.set("att.lang",lang);renderChrome();renderTabs();render()}
  if(p){themePick=p.dataset.tpick;store.set("att.theme",themePick);applyTheme();renderChrome()}
});

/* summarise one day document */
function summ(r){
  if(!r) return null;
  const ev=r.events||[]; const E=T().evt;
  const first=ev.find(e=>e.type==="in");
  const last=[...ev].reverse().find(e=>e.type==="out"||e.type==="early");
  const early=ev.find(e=>e.type==="early");
  const outside=ev.length&&ev[ev.length-1].type==="offi";
  return {in:first?.time||"",out:last?.time||"",late:!!(first&&first.time>settings.lateAfter),early:!!early,outside,
    notes:ev.filter(e=>e.type==="offi"||e.type==="back"||e.type==="early").map(e=>{const lbl=e.opt?((e.type==="early"?T().reasons:T().duties)[e.opt]||e.note):e.note;return `${E[e.type]} ${e.time}${lbl?" ("+lbl+")":""}`})};
}

let myClaim=null,myToday=null,pending=null,reason="",clockT=null;
function myStaff(){return staff.find(s=>s.uid&&s.uid===me)||null}
function claimedStaff(){return myClaim?.claimStaffId?staff.find(s=>s.id===myClaim.claimStaffId):null}
function startStaff(){
  const today=dstr(new Date());
  off("claim");off("today");
  unsub.claim=db.doc("att/"+me).onSnapshot(s=>{myClaim=s.exists?s.data():null;renderStaff()},()=>{});
  unsub.today=db.doc(`att/${me}/days/${today}`).onSnapshot(s=>{myToday=s.exists?s.data():null;renderStaff()},()=>{});
  off("myleave"); unsub.myleave=db.collection("leave").where("uid","==",me).onSnapshot(q=>{myLeaves=q.docs.map(d=>({id:d.id,...d.data()}));renderStaff()},()=>{});
  clearInterval(clockT);clockT=setInterval(()=>{const c=$("#clock");if(c)c.textContent=tstr(new Date())},5000);
}
function renderStaff(){
  if(currentTab!=="mark"||!booted) return;
  const V=$("#view"); const now=new Date(); const today=dstr(now); const E=T().evt;
  const linked=myStaff(); const claimed=!linked&&claimedStaff();
  const s=linked||claimed;
  let body="";
  if(!s){
    body=`<div class="sheet"><h3>${t("whoAreYou")}</h3><p class="muted" style="margin:0;font-size:14px">${t("whoHelp")}</p>
      <div class="names">${staff.filter(x=>!x.uid).map(x=>`<button type="button" data-claim="${x.id}">${esc(x.name)}${x.title?` <span class="muted" style="font-size:13px">· ${esc(x.title)}</span>`:""}</button>`).join("")||`<p class="muted">${t("noNames")}</p>`}</div></div>`;
  } else {
    const ev=myToday?.events||[]; const last=ev[ev.length-1]?.type;
    const arrived=ev.some(e=>e.type==="in"); const left=last==="out"||last==="early"; const outside=last==="offi";
    let acts="";
    if(pending){
      const isEarly=pending==="early", isOffi=pending==="offi"; const opts=isEarly?T().reasons:isOffi?T().duties:null;
      acts=`<div class="sheet"><h3>${t("confirmX",E[pending])}</h3>
        <div class="row"><span class="muted">${t("time")}</span><span class="tm" style="font-size:22px;font-weight:600">${tstr(now)}</span></div>
        ${opts?`<div><div class="muted" style="font-size:13px;margin-bottom:6px">${isEarly?t("chooseReason"):t("chooseDuty")}</div><div class="reasons" role="group">${Object.entries(opts).map(([k,v])=>`<button type="button" data-reason="${k}" aria-pressed="${reason===k}">${esc(v)}</button>`).join("")}</div></div>`:""}
        <div class="row"><button class="btn" type="button" id="cancelAct">${t("cancel")}</button><button class="btn primary" type="button" id="confirmAct" ${opts&&!reason?"disabled":""}>${t("confirm")}</button></div></div>`;
    } else if(!arrived){
      acts=`<div class="actions"><button class="act in" type="button" data-act="in">${E.in}<small>${t("inSub")}</small></button></div>`;
    } else if(left){
      const sm=summ(myToday);
      acts=`<div class="done">${t("doneDay")}<br><span style="font-weight:400;font-size:14px">${t("doneLine",sm.in,sm.out)}</span></div>`;
    } else if(outside){
      acts=`<div class="actions"><button class="act back" type="button" data-act="back">${E.back}<small>${t("backSub")}</small></button>
        <button class="act out" type="button" data-act="out">${E.out}<small>${t("outThere")}</small></button><button class="act early" type="button" data-act="early">${E.early}<small>${t("earlySub")}</small></button></div>`;
    } else {
      const beforeEnd=tstr(now)<settings.endTime;
      acts=`<div class="actions">
        <button class="act out" type="button" data-act="${beforeEnd?"early":"out"}">${E.out}<small>${beforeEnd?t("outBefore",settings.endTime):t("outSub")}</small></button>
        <button class="act early" type="button" data-act="early">${E.early}<small>${t("earlySub")}</small></button>
        <button class="act offi" type="button" data-act="offi">${E.offi}<small>${t("offiSub")}</small></button></div>`;
    }
    body=`${claimed?`<div class="notice warn">${esc(t("pendingNote",claimed.name))}</div>`:""}
      ${acts}
      ${ev.length&&!left&&!pending?`<p class="muted" style="margin:0;text-align:center;font-size:14px">${t("lastRec",E[ev[ev.length-1].type],`<span class="tm">${ev[ev.length-1].time}</span>`)}</p>`:""}`;
    const todayLv=linked?leaveOn(linked.id,today,myLeaves):null;
    if(todayLv&&!lv) body=`<div class="notice">${t("onLeave")}: <b>${esc(leaveLabel(todayLv))}</b></div>`+body;
    body=`<div class="who"><div><span class="muted" style="font-size:13px">${t("staffLbl")}</span><br><b>${esc(s.name)}</b></div>${linked?`<span class="chip ok">${t("recognised")}</span>`:`<span class="chip late">${t("awaiting")}</span>`}</div>`+(lv?"":body)+(linked&&!pending?leaveStaffHtml(linked):"");
  }
  V.innerHTML=`<div class="panel"><div class="mark">
    <div><div class="clock" id="clock">${tstr(now)}</div><div class="dateline">${prettyDate(today)}</div></div>
    ${body}</div></div>`;
}
async function doAct(type){
  const now=new Date(); const date=dstr(now); const time=tstr(now);
  const s=myStaff()||claimedStaff(); if(!s) return;
  const list=type==="early"?L.si.reasons:type==="offi"?L.si.duties:null;
  const opt=list&&reason?reason:""; const note=opt?list[opt]:"";
  const ev=[...(myToday?.events||[]),{type,time,opt,note,at:now.toISOString()}];
  const btn=$("#confirmAct"); if(btn){btn.disabled=true;btn.textContent=t("saving")}
  try{
    await db.doc(`att/${me}/days/${date}`).set({date,month:date.slice(0,7),staffId:s.id,staffName:s.name,events:ev,updatedAt:now.toISOString()});
    pending=null;reason="";toast(t("recorded",T().evt[type],time));
  }catch(e){toast(t("errSave"));if(btn){btn.disabled=false;btn.textContent=t("confirm")}}
  renderStaff();
}
document.addEventListener("click",async e=>{
  if(currentTab!=="mark") return;
  const c=e.target.closest("[data-claim]");
  if(c){try{await db.doc("att/"+me).set({claimStaffId:c.dataset.claim,claimedAt:new Date().toISOString(),claimName:authUser?.displayName||"",claimEmail:(authUser?.email||"").toLowerCase()});toast(t("registered"))}catch(err){toast(t("errRegister"))}return}
  const a=e.target.closest("[data-act]");
  if(a){pending=a.dataset.act;reason="";renderStaff();$("#confirmAct")?.focus();return}
  const r=e.target.closest("[data-reason]");
  if(r){reason=r.dataset.reason;renderStaff();return}
  if(e.target.id==="cancelAct"){pending=null;reason="";renderStaff();return}
  if(e.target.id==="lvOpen"){const d=dstr(new Date());lv={type:"",from:d,to:d,part:"full"};renderStaff();return}
  if(e.target.id==="lvCancel"){lv=null;renderStaff();return}
  const lt=e.target.closest("[data-ltype]"); if(lt&&lv){lv.type=lt.dataset.ltype;renderStaff();return}
  const lp=e.target.closest("[data-lpart]"); if(lp&&lv&&!lp.disabled){lv.part=lp.dataset.lpart;renderStaff();return}
  if(e.target.id==="lvSubmit"&&lv){const s=myStaff();if(s)submitLeave(s);return}
  const ld=e.target.closest("[data-lvdel]"); if(ld){try{await db.doc("leave/"+ld.dataset.lvdel).delete();toast(t("reqCancelled"))}catch(err){toast(t("errSave"))}return}
  if(e.target.id==="confirmAct"){doAct(pending);return}
});

function leaveDays(from,to,part){if(part&&part!=="full")return 0.5;const a=new Date(from+"T00:00"),b=new Date(to+"T00:00");return Math.round((b-a)/864e5)+1}
function leaveOn(staffId,date,list){return (list||leaves).find(l=>l.staffId===staffId&&l.status==="approved"&&l.from<=date&&l.to>=date)}
function leaveLabel(l){return T().ltypes[l.type]+(l.part&&l.part!=="full"?` (${T().lparts[l.part]})`:"")}
function quota(type){const q=settings.leaveQuota?.[type];return (q===undefined||q===null||q==="")?null:Number(q)}
function usedDays(list,staffId,type,year){return list.filter(l=>l.staffId===staffId&&l.type===type&&l.status==="approved"&&l.from.slice(0,4)===String(year)).reduce((a,l)=>a+(Number(l.days)||0),0)}
function leaveInMonth(staffId,key,lastDay){let n=0;for(let d=1;d<=lastDay;d++){const l=leaveOn(staffId,`${key}-${pad(d)}`);if(l)n+=l.part&&l.part!=="full"?0.5:1}return n}
const fmtRange=l=>l.from===l.to?l.from:`${l.from} → ${l.to}`;
const stChip=st=>`<span class="chip ${st==="approved"?"ok":st==="rejected"?"miss":"late"}">${T().lstatus[st]}</span>`;

async function submitLeave(s){
  if(!lv.type){toast(t("chooseType"));return}
  if(!lv.from||!lv.to||lv.to<lv.from){toast(t("badRange"));return}
  if(lv.part!=="full"&&lv.from!==lv.to){toast(t("halfOneDay"));return}
  const days=leaveDays(lv.from,lv.to,lv.part); const q=quota(lv.type);
  if(q!=null&&days>q-usedDays(myLeaves,s.id,lv.type,new Date().getFullYear())){toast(t("overQuota"));return}
  const id=me.slice(0,12)+"_"+Date.now().toString(36);
  try{await db.doc("leave/"+id).set({uid:me,staffId:s.id,staffName:s.name,type:lv.type,from:lv.from,to:lv.to,part:lv.part,days,status:"pending",by:"staff",requestedAt:new Date().toISOString()});lv=null;toast(t("reqSent"))}
  catch(e){toast(t("errSave"))}
  renderStaff();
}

function watchMonth(){

  if(sig===monthKey) return; monthKey=sig;

/* resize a chosen photo to a 300x400 portrait JPEG (about 20-40 KB) so it fits inside the staff record */
function shrinkPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{const W=300,H=400,r=W/H; let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;
    if(sw/sh>r){const nw=sh*r;sx=(sw-nw)/2;sw=nw}else{const nh=sw/r;sy=(sh-nh)/2;sh=nh}
    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,sx,sy,sw,sh,0,0,W,H);
    URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.8))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))}; img.src=url;})}

/* ---------- monthly PDF ---------- */
let pdfLog={}, pdfBusy=false;
function dueMonth(){
  const n=new Date(); const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  const cur=dstr(n).slice(0,7); const prev=dstr(new Date(n.getFullYear(),n.getMonth()-1,1)).slice(0,7);
  if(cur>="2027-01"&&n.getDate()>=last-1&&!pdfLog[cur]) return cur;
  if(prev>="2027-01"&&!pdfLog[prev]) return prev;
  return null;
}
function dueBar(){
  const k=dueMonth(); if(!k||!downloads) return "";
  const [y,m]=k.split("-").map(Number);
  return `<div class="duebar" role="status"><div><b>${t("dueTitle",y,T().months[m-1])}</b><br><span class="muted" style="font-size:13px">${t("dueSub")}</span></div>
    <button class="btn primary" type="button" data-pdf="${k}">${pdfBusy?t("preparing"):t("pdfDl")}</button></div>`;
}
async function fetchMonth(key){
  const o={};
  await Promise.all(staff.filter(s=>s.uid).map(async s=>{
    const q=await db.collection(`att/${s.uid}/days`).where("month","==",key).get();
    o[s.id]={}; q.docs.forEach(d=>o[s.id][d.id]=d.data());
  }));
  return o;
}
async function makePdf(key){
  if(typeof html2canvas==="undefined"||!window.jspdf) throw {code:"libs"};
  const recs=await fetchMonth(key);
  const [y,mo]=key.split("-").map(Number); const n=shownDays(y,mo); if(!n) throw {code:"notStarted"};
  const title=t("reportTitle"); const sub=t("monthTitle",y,T().months[mo-1]);
  const made=new Date(); const madeTxt=t("madeBy",`${dstr(made)} ${tstr(made)}`);
  const sumRows=staff.map(s=>{let p=0,l=0,e=0,o=0;Object.values(recs[s.id]||{}).forEach(r=>{const m=summ(r);if(m?.in){p++;if(m.late)l++;if(m.early)e++;if((r.events||[]).some(x=>x.type==="offi"))o++}});
    return `<tr><td>${esc(s.name)}${s.title?` <span style="color:#5B6069">(${esc(s.title)})</span>`:""}</td><td class="c">${p}</td><td class="c">${l}</td><td class="c">${e}</td><td class="c">${o}</td><td class="c">${leaveInMonth(s.id,key,n)}</td></tr>`}).join("");
  const host=document.createElement("div"); host.className="pdfhost"; document.body.appendChild(host);
  const pages=[];
  const newPage=first=>{const pg=document.createElement("div");pg.className="pg";
    pg.innerHTML=`<div class="ph"><img src="${LOGO_PRINT}" alt=""><div class="tt"><h1>${esc(title)}</h1><b style="font-size:13px;color:#575231">${esc(sub)}</b><br><span>${madeTxt}</span></div></div><div class="body">${first?`<h2>${t("summary")}</h2>
      <table><thead><tr><th style="text-align:left">${t("colName")}</th><th>${t("daysPresent")}</th><th>${t("late")}</th><th>${t("earlyChip")}</th><th>${t("officialDuty")}</th><th>${t("leaveDaysCol")}</th></tr></thead><tbody>${sumRows}</tbody></table>
      <p style="margin:6px 0 12px;color:#5B6069;font-size:11px">${t("pdfRule",settings.lateAfter,settings.endTime)}<br>${t("pdfNotesKey")}</p><h2>${t("dailyReg")}</h2>`:""}
      <table class="daily"><thead><tr><th style="width:70px">${t("colDate")}</th><th style="text-align:left">${t("colName")}</th><th style="width:66px">${t("lblIn")}</th><th style="width:66px">${t("lblOut")}</th><th style="text-align:left">${t("colNotes")}</th></tr></thead><tbody></tbody></table></div>
      <div class="pf"><span>${esc(title)} · ${esc(sub)}</span><span class="pn"></span></div>`;
    host.appendChild(pg); pages.push(pg); return pg};
  let pg=newPage(true);
  const fits=p=>{const b=p.querySelector(".body");return b.scrollHeight<=b.clientHeight};
  for(let d=1;d<=n;d++){
    const date=`${y}-${pad(mo)}-${pad(d)}`; const wd=new Date(y,mo-1,d).getDay(); const we=wd===0||wd===6;
    const html=staff.map((s,i)=>{const m=summ(recs[s.id]?.[date]);
      return `<tr class="${we?"we":""}">${i===0?`<td class="c" rowspan="${staff.length}">${d}<br><span style="font-size:10px;color:#5B6069">${T().wd[wd]}</span></td>`:""}<td>${esc(s.name)}</td>
        <td class="c ${m?.late?"lt":""}">${m?.in||"—"}</td><td class="c ${m?.early?"lt":""}">${m?.out||"—"}</td>
        <td style="font-size:11px">${(()=>{const l=leaveOn(s.id,date);const lt=l?`<span style="color:#2F5E8C;font-weight:600">${esc(t("onLeave")+": "+leaveLabel(l))}</span>`:"";
          return m?[lt,m.late?esc(t("late")):"",...m.notes.map(esc)].filter(Boolean).join("<br>"):(lt||(s.uid?`<span style="color:#AD3746">${t("absent")}</span>`:""))})()}</td></tr>`}).join("");
    const tb=pg.querySelector("table.daily tbody"); tb.insertAdjacentHTML("beforeend",html);
    if(!fits(pg)){ for(let i=0;i<staff.length;i++) tb.lastElementChild.remove(); pg=newPage(false); pg.querySelector("table.daily tbody").insertAdjacentHTML("beforeend",html); }
  }
  const sign=`<div class="sign"><div>${t("signPrep")}</div><div>${t("signCert")}</div><div>${t("colDate")}</div></div>`;
  pg.querySelector(".body").insertAdjacentHTML("beforeend",sign);
  if(!fits(pg)){pg.querySelector(".sign").remove();pg=newPage(false);pg.querySelector("table.daily").remove();pg.querySelector(".body").insertAdjacentHTML("beforeend",sign)}
  pages.forEach((p,i)=>p.querySelector(".pn").textContent=t("page",i+1,pages.length));
  try{
    if(document.fonts?.ready) await document.fonts.ready;
    await Promise.all([...host.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
    for(let i=0;i<pages.length;i++){
      const c=await html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg",0.9),"JPEG",0,0,595.28,841.89);
    }
    await downloads.save({filename:`attendance-${key}.pdf`,data:pdf.output("blob")});
  } finally { host.remove(); }
  await db.doc("config/pdflog").set({...pdfLog,[key]:new Date().toISOString()});
}

    else if(tg.id==="seedStaff"){const names=["විමලදාස මහතා","සුජිත් මහතා","කාලිදාස මහතා"];for(let i=0;i<names.length;i++)await db.doc("staff/s"+(i+1)).set({name:names[i],order:i+1});}
    else if(tg.id==="copyUrl"){try{await navigator.clipboard.writeText(APP_URL);toast(t("copied"))}catch(err){const u=document.querySelector(".url");const r=document.createRange();r.selectNodeContents(u);getSelection().removeAllRanges();getSelection().addRange(r)}}
    else if(tg.id==="qrDl"){const c=$("#qr canvas");const blob=await new Promise(r=>c.toBlob(r,"image/png"));await downloads.save({filename:"attendance-qr.png",data:blob})}
  }catch(err){if(err?.code!=="declined")toast(t("changeFail"))}
});

/* ================= BOOT (Firebase) ================= */
let authUser=null, adminEmails=[], installEvt=null, autoTried=false, staffLoaded=false, pdfLoaded=false;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;renderChrome()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
function wrapSnap(x){return {id:x.id,exists:x.exists,data:()=>x.data()}}
function mkQuery(q){return {where:(f,o,v)=>mkQuery(q.where(f,o,v)),
  get:async()=>{const r=await q.get();return {docs:r.docs.map(wrapSnap)}},
  onSnapshot:(n,e)=>q.onSnapshot(r=>n({docs:r.docs.map(wrapSnap)}),e)}}
function makeDb(f){return {
  doc:p=>{const r=f.doc(p);return {get:async()=>wrapSnap(await r.get()),set:d=>r.set(d),update:d=>r.update(d),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(x=>n(wrapSnap(x)),e)}},
  collection:p=>mkQuery(f.collection(p))}}
async function saveFile({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:"saved"};
}
const GSVG='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function showSignIn(){
  booted=false; document.body.classList.add("staffmode"); $("#tabs").hidden=true; $("#role").textContent="";
  $("#view").innerHTML=`<div class="panel"><div class="signin"><div class="clock" id="clock">${tstr(new Date())}</div><div class="dateline">${prettyDate(dstr(new Date()))}</div>
    <h2>${t("signInTitle")}</h2><p class="muted" style="margin:0">${t("signInText")}</p>
    <div><button class="gbtn" type="button" id="gSignIn">${GSVG}${t("signInBtn")}</button></div></div></div>`;
  $("#gSignIn").onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{await firebase.auth().signInWithPopup(p)}
    catch(e){ if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){try{await firebase.auth().signInWithRedirect(p)}catch(_){toast(t("signInFail"))}} else if(e?.code!=="auth/popup-closed-by-user"&&e?.code!=="auth/cancelled-popup-request") toast(t("signInFail")) }
  };
}
function showFirstAdmin(u,fdb){
  $("#view").innerHTML=`<div class="panel"><div class="signin"><h2>${t("firstAdminTitle")}</h2><p style="margin:0">${esc(t("firstAdminText",u.email||""))}</p>
    <div><button class="btn primary" type="button" id="claimAdmin">${t("firstAdminBtn")}</button></div></div></div>`;
  $("#claimAdmin").onclick=async()=>{try{await fdb.doc("config/admins").set({emails:[(u.email||"").toLowerCase()]});location.reload()}catch(e){toast(t("changeFail"))}};
}
function maybeAutoPdf(){
  if(!isAdmin||autoTried||!staffLoaded||!pdfLoaded||!downloads) return;
  const k=dueMonth(); if(!k) return; autoTried=true;
  const [y,m]=k.split("-").map(Number);
  pdfBusy=true; render();
  makePdf(k).then(()=>toast(t("autoPdf",t("monthTitle",y,T().months[m-1])))).catch(()=>{}).finally(()=>{pdfBusy=false;render()});
}
function startApp(){
  booted=true;
  document.body.classList.toggle("staffmode",!isAdmin);
  renderChrome();
  currentTab=isAdmin&&location.hash!=="#mark"?(location.hash==="#pdf"?"month":"today"):"mark";
  if(isAdmin){
    unsub.pdflog=db.doc("config/pdflog").onSnapshot(s=>{pdfLog=s.exists?s.data():{};pdfLoaded=true;render();maybeAutoPdf()},()=>{});
    unsub.admins=db.doc("config/admins").onSnapshot(s=>{adminEmails=s.exists?(s.data().emails||[]):[];render()},()=>{});
  }
  unsub.settings=db.doc("config/settings").onSnapshot(s=>{if(s.exists)settings={...settings,...s.data()};render()},()=>{});
  unsub.staff=db.collection("staff").onSnapshot(q=>{
    staff=q.docs.map(x=>({id:x.id,raw:x.data(),...x.data()})).sort((a,b)=>(a.order??99)-(b.order??99));
    staffLoaded=true; if(isAdmin)loadProfiles([]); renderTabs(); render(); maybeAutoPdf();
  },()=>{$("#view").innerHTML=`<div class="panel"><div class="notice warn">${t("staffReadFail")}</div></div>`});
  startStaff(); if(isAdmin) startAdmin();
  renderTabs(); render();
}
renderChrome();
$("#role").textContent=t("connecting");
$("#view").innerHTML=`<div class="panel loading">${t("loading")}</div>`;
(async()=>{
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!window.firebase){$("#role").textContent=t("notConnected");$("#view").innerHTML=`<div class="panel"><div class="notice warn">${t("openInClaude")}</div></div>`;return}
  firebase.initializeApp(cfg);
  const fdb=firebase.firestore();
  try{await fdb.enablePersistence({synchronizeTabs:true})}catch(e){}
  db=makeDb(fdb); downloads={save:saveFile};
  try{await firebase.auth().getRedirectResult()}catch(e){}
  firebase.auth().onAuthStateChanged(async u=>{
    Object.keys(unsub).forEach(off); booted=false; authUser=u; renderChrome();
    if(!u){showSignIn();return}
    me=u.uid;
    $("#view").innerHTML=`<div class="panel loading">${t("loading")}</div>`;
    let adm=null; try{adm=await fdb.doc("config/admins").get()}catch(e){}
    if(adm&&!adm.exists){showFirstAdmin(u,fdb);return}
    adminEmails=adm?.data()?.emails||[];
    isAdmin=adminEmails.includes((u.email||"").toLowerCase());
    user={id:async()=>me,profiles:async ids=>{const o={};await Promise.all(ids.map(async id=>{try{const d=await fdb.doc("att/"+id).get();const x=d.data()||{};o[id]={name:x.claimName||x.claimEmail||""}}catch(e){o[id]=null}}));return o}};
    startApp();
  });
})();
})();
</script>
